<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dashboard — ExpensePilot</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main fade-in">
      <div class="page-head">
        <div>
          <div class="page-title">Dashboard</div>
          <div class="page-sub" id="subLine">Loading…</div>
        </div>
        <button class="btn btn-primary" id="refreshBtn">↻ Scan now</button>
      </div>

      <div class="grid grid-4 stagger" id="stats"></div>

      <div style="height:18px"></div>
      <div class="grid grid-2 stagger">
        <div class="card">
          <div class="section-title">Recent activity</div>
          <div id="recent"></div>
        </div>
        <div class="card">
          <div class="section-title">Spending by category</div>
          <div class="chart-wrap"><canvas id="catChart"></canvas></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../vendor/chart.umd.js"></script>
  <script type="module">
    import { mountLayout } from "./_layout.js";
    import { get, KEYS } from "../utils/storage.js";
    import { monthStats, byCategory } from "../utils/stats.js";
    import { inr, fmtDate, animateNumber } from "../utils/format.js";

    await mountLayout("dashboard");

    const txs = (await get(KEYS.TRANSACTIONS, [])) || [];
    const s = monthStats(txs);

    document.getElementById("subLine").textContent =
      `${new Date().toLocaleDateString("en-IN", { month: "long", year: "numeric" })} · ${s.count} transactions`;

    const cards = [
      { label: "Spent this month", value: s.spent, icon: "💸", delta: "-8% vs last", cls: "delta-down" },
      { label: "Income", value: s.income, icon: "💰", delta: "+2% vs last", cls: "delta-up" },
      { label: "Savings", value: s.savings, icon: "🏦", delta: s.savings >= 0 ? "On track" : "Overspent", cls: s.savings >= 0 ? "delta-up" : "delta-down" },
      { label: "Largest expense", value: s.largest ? s.largest.amount : 0, icon: "🔥", delta: s.largest ? s.largest.merchant : "—", cls: "delta-down" },
    ];
    const statsEl = document.getElementById("stats");
    statsEl.innerHTML = cards.map((c, i) => `
      <div class="card">
        <div class="card-row">
          <div>
            <div class="stat-label">${c.label}</div>
            <div class="stat-value currency" id="sv-${i}">₹0</div>
            <div class="stat-delta ${c.cls}">${c.delta}</div>
          </div>
          <div class="stat-icon">${c.icon}</div>
        </div>
      </div>`).join("");
    cards.forEach((c, i) => animateNumber(document.getElementById(`sv-${i}`), c.value, 900, (v) => inr(v)));

    // Recent
    const recent = txs.slice(0, 6);
    document.getElementById("recent").innerHTML = recent.length ? recent.map((t) => `
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
        <div class="stat-icon" style="width:36px;height:36px;font-size:14px">${t.merchant[0]}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.merchant}</div>
          <div style="color:var(--text-mute);font-size:12px">${fmtDate(t.date)} · ${t.bank}</div>
        </div>
        <div style="text-align:right">
          <div class="currency" style="font-weight:600;color:${t.type === "Credit" ? "var(--success)" : "var(--text)"}">${t.type === "Credit" ? "+" : "-"}${inr(t.amount)}</div>
          <div class="pill pill-cat" style="margin-top:2px">${t.category}</div>
        </div>
      </div>
    `).join("") : `<div class="empty"><h3>No transactions yet</h3><p>Connect Gmail or import a demo dataset.</p></div>`;

    // Category chart
    const cats = byCategory(s.transactions).slice(0, 6);
    const ctx = document.getElementById("catChart");
    if (cats.length) {
      new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: cats.map((c) => c[0]),
          datasets: [{
            data: cats.map((c) => c[1]),
            backgroundColor: ["#7c5cff","#22d3ee","#33e0a3","#ffb547","#ff5c7a","#a78bfa","#60a5fa"],
            borderWidth: 0, borderRadius: 6,
          }],
        },
        options: {
          plugins: { legend: { position: "right", labels: { color: "#9aa0b4", boxWidth: 10 } } },
          cutout: "62%", maintainAspectRatio: false,
        },
      });
    }

    document.getElementById("refreshBtn").onclick = () => {
      document.getElementById("refreshBtn").textContent = "Scanning...";
      chrome.runtime.sendMessage({ type: "ep_force_sync" }, () => {
        location.reload();
      });
    };
  </script>
</body>
</html>
