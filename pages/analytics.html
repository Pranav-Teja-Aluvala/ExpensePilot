<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Analytics — ExpensePilot</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main fade-in">
      <div class="page-head">
        <div>
          <div class="page-title">Analytics</div>
          <div class="page-sub">Deep dive into your spending patterns</div>
        </div>
      </div>

      <div class="grid grid-2 stagger">
        <div class="card">
          <div class="section-title">Expenses by category</div>
          <div class="chart-wrap"><canvas id="pie"></canvas></div>
        </div>
        <div class="card">
          <div class="section-title">Weekly spending</div>
          <div class="chart-wrap"><canvas id="bar"></canvas></div>
        </div>
      </div>

      <div style="height:18px"></div>
      <div class="card">
        <div class="section-title">Monthly spending trend</div>
        <div class="chart-wrap tall"><canvas id="line"></canvas></div>
      </div>

      <div style="height:18px"></div>
      <div class="card">
        <div class="section-title">Daily spending intensity (last 90 days)</div>
        <div id="heatmap" class="heatmap"></div>
      </div>
    </main>
  </div>

  <script src="../vendor/chart.umd.js"></script>
  <script src="analytics.js" type="module"></script>
</body>
</html>
